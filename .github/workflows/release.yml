name: Release

# Wydanie jednego skilla: tag w formacie <tag_prefix><LIB_VERSION> z tools/release.json,
# np. napisy-v3.1.1 albo narracja-v1.0. Dziala po wypchnieciu tagu i po opublikowaniu wydania w interfejsie GitHuba.
on:
  push:
    tags: ["*-v*"]
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    if: contains(github.ref_name, '-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: python -m pytest -q tests
      - name: Dopasuj tag do skilla, sprawdz SKILL.md, zbuduj paczke
        id: build
        run: python tools/build.py --release "${GITHUB_REF_NAME}"
      - name: Plik pod adresem z SKILL.md ma oczekiwany hash
        run: |
          URL="${{ steps.build.outputs.url }}"; SHA="${{ steps.build.outputs.sha }}"
          for i in 1 2 3 4 5; do
            GOT=$(curl -fsSL "$URL" | sha256sum | cut -d' ' -f1) && [ "$GOT" = "$SHA" ] && break
            sleep 10
          done
          echo "oczekiwany $SHA"; echo "pobrany    $GOT"
          [ "$GOT" = "$SHA" ]
      - name: Utworz wydanie
        env:
          GH_TOKEN: ${{ github.token }}
          SKILL: ${{ steps.build.outputs.skill }}
          ZIP: ${{ steps.build.outputs.zip }}
          VER: ${{ steps.build.outputs.ver }}
        run: |
          NOTES=$(awk "/^## ${GITHUB_REF_NAME}\$/{f=1;next} /^## /{f=0} f" CHANGELOG.md)
          TITLE="${SKILL} ${VER}"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            # wydanie utworzone recznie w interfejsie GitHuba - dolacz paczke i opis z CHANGELOG
            gh release upload "$GITHUB_REF_NAME" "$ZIP" --clobber
            gh release edit "$GITHUB_REF_NAME" --title "$TITLE" --notes "${NOTES:-Zob. CHANGELOG.md}"
          else
            gh release create "$GITHUB_REF_NAME" "$ZIP" --title "$TITLE" --notes "${NOTES:-Zob. CHANGELOG.md}"
          fi
